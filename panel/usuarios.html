<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión PQRS — Usuarios</title>
<link rel="stylesheet" href="../css/panel.css?v=20261006">
</head>
<body>
  <div class="header">
    <div><h1>Gestión PQRS</h1><div class="sub">Usuarios internos</div></div>
    <nav>
      <a href="inicio.html">Inicio</a>
      <a href="dashboard.html" data-modulo="pqrs">PQRS</a>
      <a href="encuestas.html" data-modulo="encuestas">Encuestas</a>
      <a href="mercadeo.html" data-modulo="mercadeo">Tablero</a>
      <a href="crm.html" data-modulo="mercadeo">CRM</a>
      <a href="sst.html" data-modulo="sst">SST</a>
      <a href="usuarios.html" class="active">Usuarios</a>
    </nav>
    <div id="auth-info"></div>
  </div>

  <div id="main">
    <div class="empty" id="no-access" style="display:none">Esta sección es solo para administradores.</div>

    <div id="content" style="display:none">
      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3>Nuevo usuario</h3></div>
        <div class="mbody">
          <div class="form-grid">
            <div><label class="ef-label">Nombre</label><input class="ef" id="n-nombre"></div>
            <div><label class="ef-label">Correo</label><input class="ef" id="n-email" type="email"></div>
            <div><label class="ef-label">Contraseña</label><input class="ef" id="n-password" type="password"></div>
            <div><label class="ef-label" for="n-rol">Rol</label>
              <select class="ef" id="n-rol">
                <option value="lector">Lector (PQRS, solo lectura)</option>
                <option value="gestor">Gestor (PQRS)</option>
                <option value="mercadeo">Mercadeo (solo Tablero y CRM)</option>
                <option value="sst">SST (solo módulo SST)</option>
                <option value="admin">Admin (todo)</option>
              </select>
            </div>
            <div><label class="ef-label">Módulos adicionales</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:0.84rem;padding:6px 0 2px">
                <input type="checkbox" id="n-mod-mercadeo"> Tablero y CRM de Mercadeo
              </label>
              <label style="display:flex;align-items:center;gap:6px;font-size:0.84rem;padding:2px 0 6px">
                <input type="checkbox" id="n-mod-sst"> SST (Seguridad y Salud en el Trabajo)
              </label>
            </div>
          </div>
          <button class="btn-primary" id="btn-crear">Crear usuario</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Equipo</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Mercadeo</th><th>SST</th><th>Activo</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/shared/supabase-client.js?v=20261006"></script>
  <script src="../js/panel/auth.js?v=20261009"></script>
  <script src="../js/panel/usuarios.js?v=20261009"></script>
</body>
</html>
