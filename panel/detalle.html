<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión PQRS — Detalle</title>
<link rel="stylesheet" href="../css/panel.css?v=20261029b">
</head>
<body data-modulo="pqrs">
  <div class="header">
    <div>
      <h1 id="titulo-folio">PQRS</h1>
      <div class="sub"><a href="dashboard.html" style="color:white">&larr; Volver al listado</a></div>
    </div>
    <nav>
      <a href="inicio.html">Inicio</a>
      <a href="dashboard.html" data-modulo="pqrs">PQRS</a>
      <a href="encuestas.html" data-modulo="encuestas">Encuestas</a>
      <a href="mercadeo.html" data-modulo="mercadeo">Tablero</a>
      <a href="crm.html" data-modulo="mercadeo">CRM</a>
      <a href="eventos.html" data-modulo="mercadeo">Eventos</a>
      <a href="indicadores.html" data-modulo="mercadeo">Indicadores</a>
      <a href="sst.html" data-modulo="sst">SST</a>
      <a href="usuarios.html" class="auth-admin-only" data-display="inline" style="display:none">Usuarios</a>
    </nav>
    <div id="auth-info"></div>
  </div>

  <div id="main">
    <div class="empty" id="not-found" style="display:none">No se encontró esta solicitud.</div>

    <div id="content" style="display:none">
      <div class="card" style="margin-bottom:16px">
        <div class="card-head">
          <h3>Datos de la solicitud</h3>
          <span id="badges"></span>
        </div>
        <div class="mbody">
          <div class="form-grid" id="datos-grid"></div>
          <button class="btn-primary auth-admin-only" data-display="inline-block" style="display:none" id="btn-guardar-datos">Guardar datos</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3>Gestión interna</h3></div>
        <div class="mbody">
          <div class="form-grid">
            <div>
              <label class="ef-label">Estado</label>
              <select class="ef" id="g-estado">
                <option value="Nuevo">Nuevo</option>
                <option value="En proceso">En proceso</option>
                <option value="Resuelto">Resuelto</option>
                <option value="Cerrado">Cerrado</option>
              </select>
            </div>
            <div>
              <label class="ef-label">Responsable</label>
              <select class="ef" id="g-responsable"><option value="">Sin asignar</option></select>
            </div>
            <div>
              <label class="ef-label">Fecha límite</label>
              <input type="date" class="ef" id="g-fecha-limite">
            </div>
          </div>
          <button class="btn-primary" id="btn-guardar-gestion">Guardar cambios</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px" id="card-gestiones">
        <div class="card-head">
          <h3>Registro de gestión</h3>
          <span class="gest-resumen" id="gestiones-resumen"></span>
        </div>
        <div class="mbody">
          <div class="gest-form auth-edit-only" data-display="block" style="display:none">
            <div class="form-grid cols2">
              <div>
                <label class="ef-label" for="gt-fecha">Fecha de la gestión</label>
                <input type="date" class="ef" id="gt-fecha">
              </div>
              <div>
                <label class="ef-label" for="gt-tipo">Tipo de gestión</label>
                <select class="ef" id="gt-tipo"><option value="">Seleccionar…</option></select>
              </div>
              <div style="grid-column:1/-1">
                <label class="ef-label" for="gt-descripcion">¿Qué se hizo?</label>
                <textarea class="ef" id="gt-descripcion" rows="3" maxlength="2000" placeholder="Describe la gestión realizada con esta PQRS (a quién se contactó, qué se revisó, qué se respondió…)"></textarea>
              </div>
              <div style="grid-column:1/-1">
                <label class="ef-label" for="gt-resultado">Resultado o compromiso (opcional)</label>
                <textarea class="ef" id="gt-resultado" rows="2" maxlength="1000" placeholder="En qué quedó la gestión o qué sigue"></textarea>
              </div>
            </div>
            <button class="btn-primary" id="btn-registrar-gestion">Registrar gestión</button>
          </div>
          <div id="gestiones-list"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3>Adjuntos</h3></div>
        <div class="mbody">
          <div id="adjuntos-list"></div>
          <div id="adjuntos-empty" class="no-lines" style="display:none">Sin adjuntos.</div>
          <div class="auth-edit-only" data-display="block" style="display:none;margin-top:10px">
            <label class="btn-load" for="file-adjunto">📎 Agregar adjunto de gestión</label>
            <input type="file" id="file-adjunto" style="display:none">
            <span id="upload-status" style="font-size:0.8rem;color:#718096;margin-left:8px"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Bitácora</h3></div>
        <div class="mbody">
          <div class="auth-edit-only" data-display="block" style="display:none;margin-bottom:16px">
            <textarea class="ef" id="nueva-nota" rows="2" placeholder="Agregar una nota…" style="margin-bottom:8px"></textarea>
            <button class="btn-secondary" id="btn-agregar-nota">Agregar nota</button>
          </div>
          <div id="bitacora-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/shared/supabase-client.js?v=20261006"></script>
  <script src="../js/panel/auth.js?v=20261021"></script>
  <script src="../js/panel/detalle.js?v=20261029"></script>
</body>
</html>
