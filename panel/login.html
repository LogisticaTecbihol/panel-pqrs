<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión PQRS — Iniciar sesión</title>
<link rel="stylesheet" href="../css/panel.css?v=20261029">
<style>
  .login-box .ok { color: #1e8449; font-size: 0.82rem; margin-bottom: 12px; line-height: 1.4; }
  .login-box .ok:empty { display: none; }
  .login-box .link-btn { display: block; width: 100%; margin-top: 14px; padding: 0; background: none; border: none; color: #1a5276; font-size: 0.82rem; text-align: center; text-decoration: underline; cursor: pointer; }
  .login-box .link-btn:hover { color: #154360; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>Gestión PQRS</h1>

      <div id="vista-login">
        <div class="sub">Peticiones, Quejas, Reclamos y Sugerencias</div>
        <div class="ok" id="login-ok"></div>
        <div class="error" id="login-error"></div>
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
        <button class="btn-primary" style="width:100%" id="btn-login">Iniciar sesión</button>
        <button type="button" class="link-btn" id="btn-olvide">¿Olvidaste tu contraseña?</button>
      </div>

      <div id="vista-olvide" style="display:none">
        <div class="sub">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</div>
        <div class="ok" id="olvide-ok"></div>
        <div class="error" id="olvide-error"></div>
        <label for="olvide-email">Correo</label>
        <input type="email" id="olvide-email" autocomplete="username">
        <button class="btn-primary" style="width:100%" id="btn-enviar">Enviar enlace</button>
        <button type="button" class="link-btn" id="btn-volver">Volver a iniciar sesión</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/shared/supabase-client.js?v=20261006"></script>
  <script src="../js/panel/auth.js?v=20261021"></script>
  <script>
    document.getElementById('btn-login').addEventListener('click', async function () {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errEl = document.getElementById('login-error');
      errEl.textContent = '';
      document.getElementById('login-ok').textContent = '';
      if (!email || !password) { errEl.textContent = 'Ingresa correo y contraseña.'; return; }

      var btn = this;
      btn.disabled = true; btn.textContent = 'Ingresando…';
      var res = await _sb.auth.signInWithPassword({ email: email, password: password });
      btn.disabled = false; btn.textContent = 'Iniciar sesión';

      if (res.error) {
        errEl.textContent = 'Correo o contraseña incorrectos.';
        return;
      }
      location.replace('inicio.html');
    });
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });

    // ── Recuperar contraseña ──
    // Supabase envía un enlace al correo que abre restablecer.html con la sesión de recuperación.
    // Responde igual exista o no el correo, para no revelar quién tiene cuenta.
    function verOlvide(ver) {
      document.getElementById('vista-login').style.display = ver ? 'none' : '';
      document.getElementById('vista-olvide').style.display = ver ? '' : 'none';
      if (ver) {
        document.getElementById('olvide-error').textContent = '';
        document.getElementById('olvide-ok').textContent = '';
        var email = document.getElementById('olvide-email');
        if (!email.value) email.value = document.getElementById('email').value.trim();
        email.focus();
      }
    }
    document.getElementById('btn-olvide').addEventListener('click', function () { verOlvide(true); });
    document.getElementById('btn-volver').addEventListener('click', function () { verOlvide(false); });

    document.getElementById('btn-enviar').addEventListener('click', async function () {
      var email = document.getElementById('olvide-email').value.trim();
      var errEl = document.getElementById('olvide-error');
      var okEl = document.getElementById('olvide-ok');
      errEl.textContent = ''; okEl.textContent = '';
      if (!email) { errEl.textContent = 'Ingresa tu correo.'; return; }

      var btn = this;
      btn.disabled = true; btn.textContent = 'Enviando…';
      var res = await _sb.auth.resetPasswordForEmail(email, {
        redirectTo: new URL('restablecer.html', location.href).href
      });
      btn.disabled = false; btn.textContent = 'Enviar enlace';

      if (res.error) {
        errEl.textContent = (res.error.status === 429 || /rate limit|seconds/i.test(res.error.message || ''))
          ? 'Espera un minuto antes de pedir otro enlace.'
          : 'No se pudo enviar el correo. Inténtalo de nuevo en unos minutos.';
        return;
      }
      okEl.textContent = 'Si el correo está registrado, te enviamos un enlace para crear una contraseña nueva. Revisa tu bandeja de entrada y la carpeta de spam.';
    });
    document.getElementById('olvide-email').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-enviar').click();
    });

    // restablecer.html vuelve aquí con ?clave=ok; un enlace vencido trae ?olvide=1 para pedir otro.
    var params = new URLSearchParams(location.search);
    if (params.get('clave') === 'ok') document.getElementById('login-ok').textContent = 'Contraseña actualizada. Inicia sesión con la nueva.';
    if (params.get('olvide') === '1') verOlvide(true);
  </script>
</body>
</html>
