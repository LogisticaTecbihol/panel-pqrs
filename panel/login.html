<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión PQRS — Iniciar sesión</title>
<link rel="stylesheet" href="../css/panel.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>Gestión PQRS</h1>
      <div class="sub">Peticiones, Quejas, Reclamos y Sugerencias</div>
      <div class="error" id="login-error"></div>
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password">
      <button class="btn-primary" style="width:100%" id="btn-login">Iniciar sesión</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/shared/supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('btn-login').addEventListener('click', async function () {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errEl = document.getElementById('login-error');
      errEl.textContent = '';
      if (!email || !password) { errEl.textContent = 'Ingresa correo y contraseña.'; return; }

      var btn = this;
      btn.disabled = true; btn.textContent = 'Ingresando…';
      var res = await _sb.auth.signInWithPassword({ email: email, password: password });
      btn.disabled = false; btn.textContent = 'Iniciar sesión';

      if (res.error) {
        errEl.textContent = 'Correo o contraseña incorrectos.';
        return;
      }
      location.replace('dashboard.html');
    });
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
  </script>
</body>
</html>
